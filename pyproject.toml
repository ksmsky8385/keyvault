[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "keyv"
dynamic = ["version"]
description = "Encrypted terminal vault for accounts and API keys"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=41"]

[project.scripts]
keyv = "keyv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "keyv.__version__"}
