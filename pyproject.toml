[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "keyv"
version = "0.2.2"
description = "Encrypted terminal vault for accounts and API keys"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=41"]

[project.scripts]
keyv = "keyv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
